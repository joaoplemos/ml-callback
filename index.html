<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Callback</title></head>
<body>
  <h2>Código de autorização:</h2>
  <p id="code">Nenhum código recebido</p>
  <script>
    const code = new URLSearchParams(window.location.search).get("code");
    if (code) document.getElementById("code").textContent = code;
  </script>
</body>
</html>
